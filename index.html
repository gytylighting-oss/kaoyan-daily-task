<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eef5fa" />
    <title>考研每日任务书</title>
    <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=native-stable-2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="home-header">
        <div class="home-title-block">
          <p id="dateLabel" class="tiny-label">2027 英语二 + 管综</p>
          <h1>今日</h1>
        </div>
        <div class="header-actions">
          <p id="countdownTop" class="countdown-label"></p>
          <button id="cloudButton" class="icon-button" type="button" title="同步" aria-label="同步">☁</button>
          <button id="installButton" class="icon-button hidden" type="button" title="安装到桌面" aria-label="安装到桌面">+</button>
        </div>
      </header>

      <main>
        <section id="homeView" class="view active" aria-labelledby="homeTitle">
          <div id="lockBanner" class="lock-banner hidden"></div>

          <section class="hero-card" aria-labelledby="homeTitle">
            <div>
              <p class="tiny-label">自动打卡</p>
              <h2 id="homeTitle">完成今日任务</h2>
            </div>
            <div class="progress-ring" aria-label="今日完成进度">
              <span id="progressPercent">0%</span>
            </div>
          </section>

          <section id="todayTasks" class="task-stack"></section>

          <section class="panel compact-panel">
            <div class="panel-row">
              <h3>提醒</h3>
              <span class="pill">不打卡</span>
            </div>
            <div id="todayReminders" class="reminder-grid"></div>
          </section>
        </section>

        <section id="examView" class="view" aria-labelledby="examTitle"></section>

        <section id="statsView" class="view" aria-labelledby="statsTitle">
          <div class="section-title">
            <p class="tiny-label">统计</p>
            <h2 id="statsTitle">进度</h2>
          </div>
          <div id="statsGrid" class="stats-grid"></div>
          <div class="panel">
            <h3>错词回炉</h3>
            <div id="mistakeWords" class="compact-list"></div>
          </div>
          <div class="panel">
            <div class="panel-row">
              <h3>全部记录</h3>
              <span id="estimateLabel" class="pill"></span>
            </div>
            <div id="allMemoryList" class="memory-list"></div>
          </div>
        </section>

        <section id="profileView" class="view" aria-labelledby="profileTitle"></section>
      </main>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-button active" data-view="homeView" type="button">今日</button>
        <button class="nav-button" data-view="examView" type="button">真题</button>
        <button class="nav-button" data-view="profileView" type="button">我的</button>
      </nav>
    </div>

    <section id="studyScreen" class="study-screen hidden" aria-live="polite">
      <header class="study-header">
        <button id="backButton" type="button" class="round-button" aria-label="返回">‹</button>
        <div>
          <p id="studyKicker" class="tiny-label"></p>
          <h2 id="studyTitle"></h2>
        </div>
      </header>
      <div id="studyBody" class="study-body"></div>
    </section>

    <div id="wordPopover" class="word-popover hidden"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="generated-content.js?v=truth-json-5"></script>
    <script src="generated-lookup.js?v=truth-json-17"></script>
    <script src="generated-grammar.js?v=truth-json-18"></script>
    <script src="generated-writing.js?v=native-stable-2"></script>
    <script src="generated-reading-overrides.js?v=native-stable-2"></script>
    <script src="generated-analysis-bundle.js?v=native-stable-2"></script>
    <script src="exam-analysis-data.js?v=native-stable-2"></script>
    <script src="generated-exam.js?v=native-stable-2"></script>
    <script src="app.js?v=native-stable-2"></script>
  </body>
</html>
